name: Build Script - macOS
run-name: ${{ github.actor }} is building Script (macOS) 🚀
on:
  workflow_call:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      build_target:
        description: "Build target"
        required: false
        default: "script"
        type: string
      publish_manifest:
        description: "Publish the new script version to the live client manifest"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-script-macos:
    # ARM runner: cheaper and faster than Intel. macos-14 is retired on
    # 2026-11-02 and its brownouts already fail the job.
    runs-on: macos-15

    steps:
      - name: Checkout tikmatrix-pro private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tikmatrix/tikmatrix-pro
          token: ${{ secrets.REPO_TOKEN }}
          ref: ${{ inputs.branch }}
          path: tikmatrix-pro

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tikmatrix-pro/target
          key: ${{ runner.os }}-script-cargo-universal-${{ hashFiles('tikmatrix-pro/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-script-cargo-universal-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install target platforms
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build ARM64
        working-directory: tikmatrix-pro
        run: cargo build -p script --release --target aarch64-apple-darwin

      - name: Build x86_64
        working-directory: tikmatrix-pro
        run: cargo build -p script --release --target x86_64-apple-darwin

      - name: Prepare bin directories
        run: |
          # Prepare ARM64 binaries
          mkdir -p ./tikmatrix-pro/target/aarch64-apple-darwin/release/bin
          rm -f ./tikmatrix-pro/target/aarch64-apple-darwin/release/bin/* || true
          if [ -f "./tikmatrix-pro/target/aarch64-apple-darwin/release/script" ]; then
            cp ./tikmatrix-pro/target/aarch64-apple-darwin/release/script ./tikmatrix-pro/target/aarch64-apple-darwin/release/bin/
          fi

          # Prepare x86_64 binaries
          mkdir -p ./tikmatrix-pro/target/x86_64-apple-darwin/release/bin
          rm -f ./tikmatrix-pro/target/x86_64-apple-darwin/release/bin/* || true
          if [ -f "./tikmatrix-pro/target/x86_64-apple-darwin/release/script" ]; then
            cp ./tikmatrix-pro/target/x86_64-apple-darwin/release/script ./tikmatrix-pro/target/x86_64-apple-darwin/release/bin/
          fi

          # Compute version directory (strip leading 'v' for clean R2 paths)
          VERSION_DIR="${{ inputs.version }}"
          VERSION_DIR="${VERSION_DIR#v}"
          echo "VERSION_DIR=${VERSION_DIR}" >> $GITHUB_ENV

      - name: Upload ARM64 to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID_NIO }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID_NIO }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY_NIO }}
          r2-bucket: matrix-script-private
          source-dir: ./tikmatrix-pro/target/aarch64-apple-darwin/release/bin
          destination-dir: script/aarch64-apple-darwin/${{ env.VERSION_DIR }}

      - name: Upload x86_64 to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID_NIO }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID_NIO }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY_NIO }}
          r2-bucket: matrix-script-private
          source-dir: ./tikmatrix-pro/target/x86_64-apple-darwin/release/bin
          destination-dir: script/x86_64-apple-darwin/${{ env.VERSION_DIR }}

      - name: Update Library Versions
        if: ${{ inputs.publish_manifest }}
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_DIR="${VERSION#v}"

          update_lib() {
            local NAME=$1
            local PLATFORM=$2
            local TARGET=$3

            local MD5=""
            local BIN_PATH="./tikmatrix-pro/target/$TARGET/release/bin/$NAME"
            if [ -f "$BIN_PATH" ]; then
              MD5=$(md5 -q "$BIN_PATH" 2>/dev/null || md5sum "$BIN_PATH" | cut -d' ' -f1)
              echo "$NAME MD5 ($PLATFORM): $MD5"
            fi

            local UPDATE_DATA=$(cat <<EOF
          {
            "name": "$NAME",
            "platform": "$PLATFORM",
            "downloadUrl": "https://api.tikmatrix.com/front-api/release/script/$TARGET/$VERSION_DIR/$NAME",
            "version": "$VERSION_DIR",
            "app": "TikMatrix",
            "md5": "$MD5"
          }
          EOF
            )

            echo "Updating $NAME for $PLATFORM..."
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.API_KEY }}" \
              -d "$UPDATE_DATA" \
              "https://api.tikmatrix.com/ci/update_lib_v2"
          }

          update_lib "script" "mac-arm" "aarch64-apple-darwin"
          update_lib "script" "mac-intel" "x86_64-apple-darwin"

          echo "Updated script library versions to ${VERSION_DIR}"
