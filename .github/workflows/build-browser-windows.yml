name: Build TikMatrix Browser - Windows
run-name: ${{ github.actor }} is building TikMatrix Browser (Windows) 🚀
on:
  workflow_call:
    inputs:
      version:
        description: "Release version label"
        required: true
        type: string
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      mode:
        description: "release or verify-only"
        required: false
        default: "release"
        type: string
      publish_r2:
        description: "Upload release artifacts to R2"
        required: false
        default: true
        type: boolean
      notes:
        description: "Release notes (English)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-browser-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tikmatrix/tikmatrix-browser
          token: ${{ secrets.REPO_TOKEN }}
          ref: ${{ inputs.branch }}
          path: tikmatrix-browser
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tikmatrix-browser/apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tikmatrix-browser/target
            tikmatrix-browser/apps/desktop/src-tauri/target
            !tikmatrix-browser/target/**/bundle/**
            !tikmatrix-browser/apps/desktop/src-tauri/target/**/bundle/**
          key: ${{ runner.os }}-cargo-tikmatrix-browser-${{ hashFiles('tikmatrix-browser/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tikmatrix-browser-

      - name: Drop installers restored from cache
        shell: bash
        run: |
          for dir in ./tikmatrix-browser/target ./tikmatrix-browser/apps/desktop/src-tauri/target; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 4 -type d -name bundle -prune -exec rm -rf {} +
            fi
          done

      - name: Build frontend & run T12 security scan
        working-directory: tikmatrix-browser/apps/desktop
        shell: bash
        run: |
          npm ci
          npm run build
          node ../../scripts/check-bundle-secrets.mjs

      - name: Clippy & Workspace Tests
        working-directory: tikmatrix-browser
        shell: bash
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --workspace --quiet
          node --test harness/probe-server.test.mjs

      - name: Build TikMatrix Browser Windows bundle
        if: ${{ inputs.mode == 'release' }}
        working-directory: tikmatrix-browser/apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@^2 build --target x86_64-pc-windows-msvc

      - name: Stage Windows installers & checksums
        if: ${{ inputs.mode == 'release' }}
        working-directory: tikmatrix-browser
        shell: pwsh
        run: |
          $UploadDir = ".\dist-upload\windows"
          $BundleDir = ".\apps\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          New-Item -ItemType Directory -Force -Path $UploadDir | Out-Null
          if (Test-Path "$BundleDir\msi") {
            Get-ChildItem -Path "$BundleDir\msi" -Filter "*.msi" -File | Copy-Item -Destination $UploadDir
          }
          if (Test-Path "$BundleDir\nsis") {
            Get-ChildItem -Path "$BundleDir\nsis" -Filter "*.exe" -File | Copy-Item -Destination $UploadDir
          }
          $Files = Get-ChildItem -Path $UploadDir -File
          if ($Files.Count -eq 0) {
            Write-Error "No Windows installers found in $BundleDir"
            exit 1
          }
          $Files | ForEach-Object {
            $h = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File -FilePath "$UploadDir\SHA256SUMS-windows.txt" -Encoding ascii
          Get-ChildItem $UploadDir | Select-Object Name, Length

      - name: Compute R2 release dir
        if: ${{ inputs.mode == 'release' && inputs.publish_r2 }}
        working-directory: tikmatrix-browser
        shell: pwsh
        run: |
          $DIR = node ./scripts/release-paths.mjs --app=tikmatrix.browser
          echo "R2_RELEASE_DIR=$DIR" >> $env:GITHUB_ENV

      - name: Upload Windows package to R2
        if: ${{ inputs.mode == 'release' && inputs.publish_r2 }}
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID_NIO }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID_NIO }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY_NIO }}
          r2-bucket: matrix
          source-dir: ./tikmatrix-browser/dist-upload/windows
          destination-dir: ${{ env.R2_RELEASE_DIR }}

      - name: Cleanup private checkout
        if: always()
        shell: pwsh
        run: Remove-Item -Path .\tikmatrix-browser -Recurse -Force -ErrorAction SilentlyContinue
