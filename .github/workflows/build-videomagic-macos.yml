name: Build VideoMagic - macOS
run-name: ${{ github.actor }} is building VideoMagic (macOS) 🚀
on:
  workflow_call:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      notes:
        description: "Release notes (English). Used as fallback for all languages."
        required: false
        default: ""
        type: string
      gray_percentage:
        description: "Gray release percentage (0-100), default 0. If the previous release is still below 100%, the new one continues from that percentage when it is higher."
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  build-videomagic-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout VideoMagic repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tikmatrix/video-magic
          ref: ${{ inputs.branch }}
          path: video-magic
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: video-magic/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            video-magic/target
          key: ${{ runner.os }}-cargo-videomagic-${{ hashFiles('video-magic/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-videomagic-

      - name: Drop installers restored from cache
        # Uploads take every file in the bundle folders, and the Rust cache can
        # restore a previous release's installers into them: a path exclusion
        # only applies when an entry is saved, and an exact key hit is never
        # re-saved, so an older entry keeps coming back.
        shell: bash
        run: |
          if [ -d ./video-magic/target ]; then
            find ./video-magic/target -maxdepth 3 -type d -name bundle -prune -exec rm -rf {} +
          fi

      - name: Build VideoMagic package
        run: |
          cd video-magic
          npm install
          chmod +x ./build.sh
          ./build.sh

      - name: Compute R2 release dir
        run: echo "R2_RELEASE_DIR=$(node ./scripts/release-paths.js --app=videomagic)" >> $GITHUB_ENV
        working-directory: video-magic

      - name: Upload VideoMagic package to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID_NIO }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID_NIO }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY_NIO }}
          r2-bucket: matrix
          source-dir: ./video-magic/target/universal-apple-darwin/release/bundle/dmg
          destination-dir: ${{ env.R2_RELEASE_DIR }}

      - name: Clear uploaded files
        run: |
          rm -rf ./video-magic/target/universal-apple-darwin/release/bundle/dmg/*

      - name: Prepare VideoMagic macOS updater upload
        run: |
          VERSION=$(node -e "console.log(require('./video-magic/src-tauri/tauri.conf.json').version)")
          SRC_DIR="./video-magic/target/universal-apple-darwin/release/bundle/macos"
          UPLOAD_DIR="./video-magic/target/universal-apple-darwin/release/bundle/macos-upload"
          mkdir -p "$UPLOAD_DIR"
          cp "$SRC_DIR/VideoMagic.app.tar.gz" "$UPLOAD_DIR/VideoMagic_${VERSION}_universal.app.tar.gz"
          cp "$SRC_DIR/VideoMagic.app.tar.gz.sig" "$UPLOAD_DIR/VideoMagic_${VERSION}_universal.app.tar.gz.sig"

      - name: Upload VideoMagic macOS updater to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID_NIO }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID_NIO }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY_NIO }}
          r2-bucket: matrix
          source-dir: ./video-magic/target/universal-apple-darwin/release/bundle/macos-upload
          destination-dir: ${{ env.R2_RELEASE_DIR }}

      # The Mac client does not install updates itself (it opens the download
      # page), but the updater check still needs a darwin entry for this version.
      - name: Update VideoMagic version (macOS)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cd video-magic
          node scripts/update-version.js --platform=mac --app=videomagic --app-name=VideoMagic "--notes=${{ inputs.notes }}" --gray-percentage=${{ inputs.gray_percentage }}

      - name: Update VideoMagic download url
        env:
          TIKMATRIX_API_KEY: ${{ secrets.TIKMATRIX_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cd video-magic
          node scripts/update-download-url.js --platform=mac --distributor=OFFICIAL --app=videomagic --app-name=VideoMagic
