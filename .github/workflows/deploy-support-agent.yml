# Deploy the self-hosted support-ticket agent (support-agent/) to the sociflux VPS.
#
# The VPS owns the checkout: this workflow pulls tikmatrix-pro@main there, runs
# the service tests, refreshes the DSH profile and systemd unit, restarts and
# verifies /healthz. Nothing is built or uploaded from the runner, so what runs
# is whatever is pushed to main — a local commit is invisible to the run.
name: Deploy Support Agent
run-name: ${{ github.actor }} is deploying the support-ticket agent 🤖

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy, or drain and stop before a database/API upgrade
        type: choice
        options: [deploy, drain]
        default: deploy
      source_ref:
        description: main for deploy; main or a pushed full commit SHA for drain helpers
        type: string
        default: main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The update script waits up to 10 min for an in-flight ticket run to finish.
    timeout-minutes: 40
    steps:
      - name: Verify engineering issue credentials
        env:
          ISSUE_TOKEN: ${{ secrets.SUPPORT_ISSUE_GITHUB_TOKEN || secrets.AGENT_REPO_TOKEN }}
        run: |
          if [[ -z "$ISSUE_TOKEN" ]]; then
            echo 'Issue credential is unset; engineering issue delivery stays disabled'
            exit 0
          fi
          [[ "$ISSUE_TOKEN" =~ ^[A-Za-z0-9_]{20,255}$ ]] || { echo 'Invalid engineering issue credential format' >&2; exit 1; }
          github() {
            printf 'header = "Authorization: Bearer %s"\n' "$ISSUE_TOKEN" |
              curl --config - --silent --show-error --max-time 15 \
                --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "$@"
          }
          REPO_URL=https://api.github.com/repos/tikmatrix/tikmatrix-pro
          repo=$(github --fail "$REPO_URL") || { echo 'Issue credential could not access tikmatrix/tikmatrix-pro' >&2; exit 1; }
          jq -e '.private == true and .has_issues == true' <<< "$repo" >/dev/null ||
            { echo 'Expected a private repository with Issues enabled' >&2; exit 1; }
          # Missing the required title deliberately. GitHub must reject the
          # payload as invalid after accepting the issue credential.
          status=$(github --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data '{}' "$REPO_URL/issues")
          [[ "$status" == 422 ]] || { echo "Engineering credential could not write Issues (HTTP $status)" >&2; exit 1; }
          echo 'Engineering issue credential verified'

      - name: Install the deploy key
        env:
          SSH_KEY: ${{ secrets.SUPPORT_AGENT_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::secret SUPPORT_AGENT_SSH_KEY is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Update, test and restart
        env:
          AGENT_ACTION: ${{ inputs.action }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SUPPORT_SENDER_TOKEN: ${{ secrets.SUPPORT_SENDER_TOKEN }}
          ISSUE_TOKEN: ${{ secrets.SUPPORT_ISSUE_GITHUB_TOKEN || secrets.AGENT_REPO_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [[ "$AGENT_ACTION" == deploy || "$AGENT_ACTION" == drain ]] || exit 1
          [[ "$SOURCE_REF" == main || "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$AGENT_ACTION" == drain || "$SOURCE_REF" == main ]] || exit 1
          if [[ "$AGENT_ACTION" == deploy ]]; then
            [[ "$SUPPORT_SENDER_TOKEN" =~ ^[0-9a-f]{64}$ ]] || { echo 'Missing or invalid SUPPORT_SENDER_TOKEN secret' >&2; exit 1; }
            [[ -z "$DEEPSEEK_API_KEY" || "$DEEPSEEK_API_KEY" =~ ^[^[:space:]]+$ ]] || { echo 'Invalid DEEPSEEK_API_KEY secret format' >&2; exit 1; }
            [[ -z "$GEMINI_API_KEY" || "$GEMINI_API_KEY" =~ ^[^[:space:]]+$ ]] || { echo 'Invalid GEMINI_API_KEY secret format' >&2; exit 1; }
            # stdin, not command arguments or logs, carries the restricted key.
            # Whether the sender may reach customers is not deploy config: it
            # is the API's support_sender_dispatch switch, changed from the
            # admin console or Telegram (/sendon, /sendoff). The old
            # SUPPORT_SENDER_ENABLED line is dropped by this rewrite.
            {
              printf 'SUPPORT_SENDER_DB=/var/lib/tikmatrix-support-queue/queue.db\nSUPPORT_SENDER_API_URL=https://api.tikmatrix.com\nSUPPORT_SENDER_TOKEN=%s\n' "$SUPPORT_SENDER_TOKEN"
              printf 'SUPPORT_ISSUE_GITHUB_TOKEN=%s\n' "$ISSUE_TOKEN"
            } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
                root@173.254.245.208 'umask 077; rm -f -- /etc/.tikmatrix-support-agent.env.patch; cat > /etc/tikmatrix-support-sender.env'
            if [[ -n "$DEEPSEEK_API_KEY" || -n "$GEMINI_API_KEY" ]]; then
              {
                if [[ -n "$DEEPSEEK_API_KEY" ]]; then printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"; fi
                if [[ -n "$GEMINI_API_KEY" ]]; then printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"; fi
              } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
                  root@173.254.245.208 'umask 077; cat > /etc/.tikmatrix-support-agent.env.patch'
            fi
          fi
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@173.254.245.208 "bash -s -- '$AGENT_ACTION' '$SOURCE_REF'" <<'REMOTE'
          set -euo pipefail
          AGENT_ACTION="$1"
          SOURCE_REF="$2"
          REPO_DIR=/opt/tikmatrix-support/repo
          DEPLOY_TMP=""
          trap 'rm -f -- /etc/.tikmatrix-support-agent.env.patch "${DEPLOY_TMP:+${DEPLOY_TMP}/update.sh}" "${DEPLOY_TMP:+${DEPLOY_TMP}/drain.mjs}" "${DEPLOY_TMP:+${DEPLOY_TMP}/merge-agent-env.sh}"; [ -n "${DEPLOY_TMP:-}" ] && rmdir -- "$DEPLOY_TMP" 2>/dev/null || true' EXIT
          # Fetch changes no working files. Extract the new deploy tools into
          # a temporary directory; they drain/stop BEFORE updating the checkout.
          # The running old service also uses FETCH_HEAD for its sync. Never
          # overwrite it with a staging SHA while preparing a drain.
          sudo -u support-agent git -C "$REPO_DIR" fetch --quiet --no-write-fetch-head origin "+$SOURCE_REF:refs/support-deploy/helpers"
          DEPLOY_TMP=$(mktemp -d /tmp/support-deploy.XXXXXX)
          for file in update.sh drain.mjs; do
            sudo -u support-agent git -C "$REPO_DIR" show "refs/support-deploy/helpers:support-agent/deploy/$file" > "$DEPLOY_TMP/$file"
          done
          if [ "$AGENT_ACTION" = drain ]; then
            /opt/node24/bin/node "$DEPLOY_TMP/drain.mjs"
            if systemctl is-active --quiet tikmatrix-support-agent; then
              echo 'service is still active after drain' >&2
              exit 1
            fi
            echo 'support agent drained and stopped; checkout unchanged'
            exit 0
          fi
          if [ -s /etc/.tikmatrix-support-agent.env.patch ]; then
            sudo -u support-agent git -C "$REPO_DIR" show "refs/support-deploy/helpers:support-agent/deploy/merge-agent-env.sh" > "$DEPLOY_TMP/merge-agent-env.sh"
            bash "$DEPLOY_TMP/merge-agent-env.sh" /etc/tikmatrix-support-agent.env < /etc/.tikmatrix-support-agent.env.patch
            rm -f -- /etc/.tikmatrix-support-agent.env.patch
          fi
          REPO_DIR="$REPO_DIR" bash "$DEPLOY_TMP/update.sh"
          echo "deployed commit: $(sudo -u support-agent git -C "$REPO_DIR" rev-parse --short HEAD)"
          systemctl is-active tikmatrix-support-agent
          journalctl -u tikmatrix-support-agent -n 10 --no-pager
          REMOTE

  notify:
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESULTS='${{ toJson(needs) }}'
          if echo "$RESULTS" | grep -q '"failure"'; then ICON="❌"; \
          elif echo "$RESULTS" | grep -q '"cancelled"'; then ICON="⚠️"; \
          else ICON="✅"; fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '%s\n%s\n%s' \
            "${ICON} ${{ github.workflow }}" \
            "Host: sociflux | Service: tikmatrix-support-agent" \
            "Run: ${RUN_URL}")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode 'link_preview_options={"is_disabled":true}' \
            --data-urlencode "text=${MSG}"
