name: Build Script - All Platforms
run-name: ${{ github.actor }} is building Script (All Platforms) 🚀
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (custom values stay unchanged); 'auto' creates script-v<date>-<sha>"
        required: false
        default: "auto"
        type: string
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      platforms:
        description: "Platforms to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      preflight_only:
        description: "Check private R2 upload credentials without building or updating the manifest"
        required: false
        default: false
        type: boolean
      publish_manifest:
        description: "Publish the built script to the live client manifest (disable for a private bucket build check)"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  create-tag:
    if: ${{ !inputs.preflight_only }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      tag: ${{ steps.resolve-version.outputs.tag }}
    steps:
      - name: Checkout tikmatrix-pro private repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tikmatrix/tikmatrix-pro
          token: ${{ secrets.REPO_TOKEN }}
          ref: ${{ inputs.branch }}

      - name: Resolve version
        id: resolve-version
        run: |
          if [[ "${{ inputs.version }}" == "auto" || -z "${{ inputs.version }}" ]]; then
            if [[ "${{ inputs.publish_manifest }}" == "false" ]]; then
              VERSION="vverify-${GITHUB_RUN_ID}"
            else
              VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
            fi
            TAG="script-${VERSION}"
          else
            VERSION="${{ inputs.version }}"
            TAG="$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"
          echo "Resolved tag: $TAG"

      - name: Create and push tag
        if: ${{ inputs.publish_manifest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.resolve-version.outputs.tag }}"

          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists on remote, skipping tag creation"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} created and pushed successfully"
          fi

  build-script-windows:
    needs: create-tag
    if: ${{ !inputs.preflight_only && (inputs.platforms == 'all' || inputs.platforms == 'windows') }}
    uses: ./.github/workflows/build-script-windows.yml
    with:
      version: ${{ needs.create-tag.outputs.version }}
      branch: ${{ inputs.branch }}
      build_target: script
      publish_manifest: ${{ inputs.publish_manifest }}
    secrets: inherit

  build-script-macos:
    needs: create-tag
    if: ${{ !inputs.preflight_only && (inputs.platforms == 'all' || inputs.platforms == 'macos') }}
    uses: ./.github/workflows/build-script-macos.yml
    with:
      version: ${{ needs.create-tag.outputs.version }}
      branch: ${{ inputs.branch }}
      build_target: script
      publish_manifest: ${{ inputs.publish_manifest }}
    secrets: inherit

  build-script-linux:
    needs: create-tag
    if: ${{ !inputs.preflight_only && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    uses: ./.github/workflows/build-script-linux.yml
    with:
      version: ${{ needs.create-tag.outputs.version }}
      branch: ${{ inputs.branch }}
      build_target: script
      publish_manifest: ${{ inputs.publish_manifest }}
    secrets: inherit

  private-r2-preflight:
    if: ${{ inputs.preflight_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare probe
        run: |
          mkdir -p r2-preflight
          printf 'TikMatrix private R2 preflight %s\n' "$GITHUB_RUN_ID" > r2-preflight/probe.txt

      - name: Check script bucket upload credentials
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c # v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID_NIO }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID_NIO }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY_NIO }}
          r2-bucket: matrix-script-private
          source-dir: r2-preflight
          destination-dir: script/_ci_preflight/${{ github.run_id }}

  notify:
    needs: [create-tag, build-script-windows, build-script-macos, build-script-linux]
    if: always() && !inputs.preflight_only
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESULTS='${{ toJson(needs) }}'
          if echo "$RESULTS" | grep -q '"failure"'; then ICON="❌"; \
          elif echo "$RESULTS" | grep -q '"cancelled"'; then ICON="⚠️"; \
          else ICON="✅"; fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '%s\n%s\n%s' \
            "${ICON} ${{ github.workflow }}" \
            "Version: ${{ needs.create-tag.outputs.version }} | Branch: ${{ inputs.branch }}" \
            "Run: ${RUN_URL}")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"
