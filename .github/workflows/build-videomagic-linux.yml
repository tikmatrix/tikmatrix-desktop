name: Build VideoMagic - Linux
run-name: ${{ github.actor }} is building VideoMagic (Linux) 🚀
on:
  workflow_call:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string
      notes:
        description: "Release notes (English). Used as fallback for all languages."
        required: false
        default: ""
        type: string
      gray_percentage:
        description: "Gray release percentage (0-100), default 0. If the previous release is still below 100%, the new one continues from that percentage when it is higher."
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  build-videomagic-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools

      - name: Checkout VideoMagic repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tikmatrix/video-magic
          ref: ${{ inputs.branch }}
          path: video-magic
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: video-magic/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Rust Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-videomagic-${{ hashFiles('video-magic/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-videomagic-

      - name: Drop installers restored from cache
        # Uploads take every file in the bundle folders, and the Rust cache can
        # restore a previous release's installers into them: a path exclusion
        # only applies when an entry is saved, and an exact key hit is never
        # re-saved, so an older entry keeps coming back.
        shell: bash
        run: |
          if [ -d ./video-magic/target ]; then
            find ./video-magic/target -maxdepth 3 -type d -name bundle -prune -exec rm -rf {} +
          fi

      - name: Build VideoMagic package
        run: |
          cd video-magic
          npm install
          chmod +x ./build-linux.sh
          ./build-linux.sh

      - name: Prepare VideoMagic package upload
        run: |
          UPLOAD_DIR=./video-magic/target/release/bundle/deb-upload
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$UPLOAD_DIR"
          find ./video-magic/target/release/bundle/deb -maxdepth 1 -type f -exec cp -t "$UPLOAD_DIR" -- {} +
          if ! find "$UPLOAD_DIR" -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "No top-level deb artifacts found for upload"
            exit 1
          fi

      - name: Compute R2 release dir
        run: echo "R2_RELEASE_DIR=$(node ./scripts/release-paths.js --app=videomagic)" >> $GITHUB_ENV
        working-directory: video-magic

      - name: Upload VideoMagic package to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID_NIO }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID_NIO }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY_NIO }}
          r2-bucket: matrix
          source-dir: ./video-magic/target/release/bundle/deb-upload
          destination-dir: ${{ env.R2_RELEASE_DIR }}

      - name: Clear uploaded files
        run: |
          rm -rf ./video-magic/target/release/bundle/deb/*
          rm -rf ./video-magic/target/release/bundle/deb-upload

      - name: Update VideoMagic download url
        env:
          TIKMATRIX_API_KEY: ${{ secrets.TIKMATRIX_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cd video-magic
          node scripts/update-download-url.js --platform=linux --distributor=OFFICIAL --app=videomagic --app-name=VideoMagic
